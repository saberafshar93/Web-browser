<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>مرورگر ساده</title>
<style>
  html, body { margin:0; padding:0; height:100%; font-family:Tahoma, Arial, sans-serif; background:#f1f3f4; }
  #bar { height:48px; background:#dfe1e5; border-bottom:1px solid #bbb; padding:7px 8px; box-sizing:border-box; }
  #bar table { width:100%; border-collapse:collapse; }
  #bar td { padding:0 3px; }
  #url { width:100%; height:32px; box-sizing:border-box; border:1px solid #999; border-radius:16px; padding:0 14px; font-size:14px; direction:ltr; text-align:left; background:#fff; }
  .btn { height:32px; border:1px solid #888; border-radius:16px; background:#fff; cursor:pointer; font-size:13px; padding:0 14px; white-space:nowrap; }
  .btn:hover { background:#e8f0fe; }
  #go { background:#1a73e8; color:#fff; border-color:#1a73e8; font-weight:bold; }
  #wrap { position:absolute; top:48px; left:0; right:0; bottom:0; }
  #frame { width:100%; height:100%; border:0; background:#fff; }
  #msg { position:absolute; top:60px; left:0; right:0; text-align:center; color:#666; font-size:14px; }
</style>
</head>
<body>

<div id="bar">
  <table><tr>
    <td style="width:1%"><button class="btn" id="go" type="button">برو (Go)</button></td>
    <td style="width:1%"><button class="btn" id="paste" type="button">پیست (Paste)</button></td>
    <td><input id="url" type="text" placeholder="آدرس سایت را وارد کنید"></td>
    <td style="width:1%"><button class="btn" id="cfg" type="button">تنظیم پروکسی</button></td>
  </tr></table>
</div>

<div id="msg">آدرس را وارد یا پیست کنید و «برو» بزنید.<br>
اگر سایت باز نشد، با «تنظیم پروکسی» آدرس Worker خود را وارد کنید.</div>
<div id="wrap"><iframe id="frame" name="frame" src="about:blank"></iframe></div>

<script>
(function () {
  // دامنه‌هایی که باید از پروکسی عبور کنند
  var TARGET = 'proofeditor.public.springernature.app';
  // آدرس Worker را اینجا بنویسید (یا با دکمه تنظیم پروکسی). مثال: https://xxx.workers.dev
  var DEFAULT_PROXY = '';

  var url = document.getElementById('url');
  var frame = document.getElementById('frame');
  var msg = document.getElementById('msg');

  function getProxy() {
    var p = '';
    try { p = window.localStorage.getItem('proxyBase') || ''; } catch (e) {}
    return p || DEFAULT_PROXY;
  }
  function setProxy(v) {
    try { window.localStorage.setItem('proxyBase', v); } catch (e) {}
  }

  function normalize(v) {
    v = v.replace(/^\s+|\s+$/g, '');
    if (!v) return '';
    if (!/^[a-zA-Z][a-zA-Z0-9+.\-]*:\/\//.test(v)) v = 'https://' + v;
    return v;
  }

  function go() {
    var u = normalize(url.value);
    if (!u) return;
    url.value = u;
    msg.style.display = 'none';

    var m = u.match(/^https?:\/\/([^\/?#]+)(.*)$/i);
    var proxy = getProxy();
    if (m && m[1].toLowerCase() === TARGET && proxy) {
      proxy = proxy.replace(/\/+$/, '');
      frame.src = proxy + (m[2] || '/');
    } else {
      frame.src = u;
    }
  }

  function fallbackPaste() {
    var t = window.prompt('آدرس را اینجا پیست کنید (Ctrl+V):', '');
    if (t) { url.value = t; go(); }
  }
  function doPaste() {
    if (navigator.clipboard && navigator.clipboard.readText) {
      navigator.clipboard.readText().then(function (t) {
        url.value = t; go();
      }, fallbackPaste);
    } else {
      fallbackPaste();
    }
  }
  function config() {
    var v = window.prompt('آدرس Worker (مثلاً https://xxx.workers.dev):', getProxy());
    if (v !== null) setProxy(v.replace(/^\s+|\s+$/g, ''));
  }

  document.getElementById('go').onclick = go;
  document.getElementById('paste').onclick = doPaste;
  document.getElementById('cfg').onclick = config;
  url.onkeydown = function (e) {
    e = e || window.event;
    if ((e.keyCode || e.which) === 13) { go(); return false; }
  };
})();
</script>
</body>
</html>
